services:
  postgres:
    image: postgres:15
    container_name: cert_generator_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: certificates_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cert_generator_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
